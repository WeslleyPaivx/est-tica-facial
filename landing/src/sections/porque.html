<section class="porque" id="por-que" aria-labelledby="porque-titulo">
  <div class="cabeca">
    <span class="chip-claro" data-entra><span class="simbolo simbolo--escuro" aria-hidden="true"><svg><use href="#i-t"/></svg></span>Por que a Zaniva</span>
    <h2 class="cabeca__titulo serifa" id="porque-titulo" data-titulo style="--atraso: 0.1s">
      <span class="linha" style="--i: 0"><span>Automação não pode</span></span>
      <span class="linha" style="--i: 1"><span>ser uma caixa-preta</span></span>
    </h2>
  </div>

  <article class="porque__card" data-entra style="--atraso: 0.15s">
    <svg class="porque__marca-d-agua" aria-hidden="true"><use href="#i-t"/></svg>

    <figure class="ilustra" data-ilustra aria-label="Três pessoas da equipe editando o mesmo fluxo ao mesmo tempo">
      <div class="ilustra__palco" data-escala-de="520">
        <div class="ilustra__cabeca">
          <strong>Fluxo de boas-vindas</strong>
          <span class="ilustra__rostos"><img src="/img/avatar/caio.webp" alt="" /><img src="/img/avatar/nina.webp" alt="" /><img src="/img/avatar/davi.webp" alt="" /></span>
        </div>
        <svg class="ilustra__fios" viewBox="0 0 520 560" aria-hidden="true">
          <path d="M125 197 V300" />
          <path data-fio-ilustra d="M200 334 C240 334 246 244 290 244" />
          <path d="M200 334 C244 334 250 364 290 364" />
          <path d="M200 334 C240 334 246 484 290 484" />
        </svg>
        <span class="bloco" data-bloco="a" style="left: 50px; top: 131px"><i style="--cor: #fce88b"></i><b style="width: 78px"></b></span>
        <span class="bloco" data-bloco="b" style="left: 50px; top: 301px"><i style="--cor: #df5eb0"></i><b style="width: 70px"></b></span>
        <span class="bloco" data-bloco="c" style="left: 290px; top: 211px"><i></i><b style="width: 74px"></b></span>
        <span class="bloco" data-bloco="d" style="left: 290px; top: 331px"><i></i><b style="width: 64px"></b></span>
        <span class="bloco" data-bloco="e" style="left: 290px; top: 451px"><i></i><b style="width: 80px"></b></span>

        <span class="colega" data-colega="caio" style="left: 196px; top: 196px"><svg class="colega__seta" style="color: #8f8f96"><use href="#i-cursor"/></svg><img src="/img/avatar/caio.webp" alt="" /></span>
        <span class="colega" data-colega="davi" style="left: 112px; top: 384px"><svg class="colega__seta colega__seta--cima" style="color: #3f8a70"><use href="#i-cursor"/></svg><img src="/img/avatar/davi.webp" alt="" /></span>
        <span class="colega colega--fala" data-colega="nina" style="left: 410px; top: 262px">
          <svg class="colega__seta" style="color: #141416"><use href="#i-cursor"/></svg>
          <span class="balao" data-balao><img src="/img/avatar/nina.webp" alt="" /><span class="balao__txt" data-balao-txt>pode publicar!</span><span class="balao__digita" aria-hidden="true"><i></i><i></i><i></i></span></span>
        </span>
      </div>
    </figure>

    <div class="porque__texto">
      <span class="porque__icone" aria-hidden="true"><svg><use href="#i-t"/></svg></span>
      <h3 class="porque__h3">Feita para a equipe confiar</h3>
      <p class="porque__p">Quando os fluxos se multiplicam, ninguém sabe mais o que roda e por quê. Na <strong>Zaniva</strong>, cada passo fica à vista: a equipe monta junto, comenta no próprio fluxo e vê o histórico de cada execução.</p>
      <a class="botao botao--branco" href="#casos"><span class="botao__txt">Ver casos de uso</span><span class="botao__seta" aria-hidden="true"><svg><use href="#i-seta-dir"/></svg><svg><use href="#i-seta-dir"/></svg></span></a>
    </div>
  </article>
</section>
