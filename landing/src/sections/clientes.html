<section class="clientes" id="depoimentos" aria-labelledby="clientes-titulo">
  <div class="cabeca">
    <span class="chip-claro" data-entra><span class="simbolo simbolo--escuro" aria-hidden="true"><svg><use href="#i-t"/></svg></span>Clientes</span>
    <h2 class="cabeca__titulo serifa" id="clientes-titulo" data-titulo style="--atraso: 0.1s">
      <span class="linha" style="--i: 0"><span>Quem automatiza</span></span>
      <span class="linha" style="--i: 1"><span>não volta à planilha</span></span>
    </h2>
  </div>

  <div class="clientes__card" data-entra style="--atraso: 0.15s" data-depo>
    <img class="clientes__fundo" src="/img/clientes-fundo.webp" srcset="/img/clientes-fundo-1100.webp 1100w, /img/clientes-fundo.webp 1672w" sizes="(max-width: 760px) 1100px, 1200px" alt="" width="1672" height="836" loading="lazy" decoding="async" />
    <figure class="depo" data-depo-texto>
      <blockquote class="depo__frase serifa" data-depo-frase>“Trocamos catorze planilhas por seis fluxos. O cadastro de um cliente novo caiu de dois dias para nove minutos.”</blockquote>
      <figcaption class="depo__autor">
        <img src="/img/avatar/marina.webp" alt="" width="56" height="56" data-depo-foto />
        <span><strong data-depo-nome>Marina Couto</strong><small data-depo-cargo>Gerente de operações, Ateliê Linho</small></span>
      </figcaption>
    </figure>
    <ul class="depo__numeros" data-depo-numeros>
      <li class="vidro"><strong>–72%</strong><span>de tempo em tarefas manuais</span></li>
      <li class="vidro"><strong>9 min</strong><span>para cadastrar um cliente</span></li>
      <li class="vidro"><strong>99,9%</strong><span>das execuções sem erro</span></li>
    </ul>
  </div>

  <div class="depo__trocas" role="tablist" aria-label="Escolher depoimento" data-entra style="--atraso: 0.3s">
    <button class="depo__rosto" type="button" role="tab" aria-selected="true" aria-label="Marina Couto, Ateliê Linho" data-i="0"><img src="/img/avatar/marina.webp" alt="" /></button>
    <button class="depo__rosto" type="button" role="tab" aria-selected="false" aria-label="Rafael Nunes, Studio Raiz" data-i="1"><img src="/img/avatar/rafa.webp" alt="" /></button>
    <button class="depo__rosto" type="button" role="tab" aria-selected="false" aria-label="Nina Albuquerque, Casa Nômade" data-i="2"><img src="/img/avatar/nina.webp" alt="" /></button>
  </div>
</section>
