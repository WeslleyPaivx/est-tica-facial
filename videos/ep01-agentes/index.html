<!doctype html>
<!-- EP01 "Contratei 5 funcionários" — vídeo 3D vertical. Palco Three.js desenhado de t; legendas e CTA em sub-composições. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Ep"; font-weight: 400; src: url("assets/fonts/Inter-400.woff2") format("woff2"); }
      @font-face { font-family: "Inter Ep"; font-weight: 700; src: url("assets/fonts/Inter-700.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c1428; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 1; }
      #captions { z-index: 2; }
      #cta { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="45" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="45"
        data-track-index="1" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="0" data-duration="45"
        data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      (function () {
        const clock = { t: 0 };
        const host = { clock, render: null };
        window.__ep01 = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["stage"] = new Promise((resolve) => (host.ready = resolve));
        const tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: 45, duration: 45, ease: "none", onUpdate: () => host.render && host.render(clock.t) });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module">
      import { createStage } from "./assets/js/stage.js";
      const host = window.__ep01;
      const stage = await createStage(document.getElementById("stage"));
      host.render = stage.render;
      stage.render(host.clock.t);
      const gl = stage.renderer.getContext();
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4)); // força o primeiro desenho dentro do setup
      window.__ep01Debug = stage;
      host.ready();
    </script>
  </body>
</html>
