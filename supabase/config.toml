# Configuração para Supabase CLI local (sem segredos). Replicar manualmente no projeto de homologação.
project_id = "zaniva-crm"

[api]
enabled = true
port = 54321
# "private" NÃO é exposto pela Data API
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
# o Supabase não oferece "maiúscula + símbolo" sem dígito; a regra completa é validada no app (features/auth/schemas.ts)
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

# Modelos de e-mail com a marca Zaniva (os mesmos são aplicados no projeto hospedado).
# Links com token_hash direto para /auth/confirm: funcionam mesmo abrindo o e-mail em outro aparelho.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Zaniva CRM"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do Zaniva CRM"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no Zaniva CRM"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao Zaniva CRM"
content_path = "./supabase/templates/magic_link.html"
